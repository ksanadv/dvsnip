[package]
name = "dvsnip-setup"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installer for dvsnip"

[workspace]

[dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
